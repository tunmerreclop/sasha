      function parseWireguardToIni(line) {
        try {
          const u = new URL(line);
          const p = u.searchParams;
          const priv = decodeURIComponent(u.username);
          const [host, port] = u.host.split(':');
          const address = p.get('address') || '';
          const psk = p.get('presharedkey') || '';
          const pub = p.get('publickey') || '';
          const mtu = p.get('mtu') || '1420';

          return [
            '[Interface]',
            `PrivateKey = ${priv}`,
            `Address = ${address}`,
            `MTU = ${mtu}`,
            '',
            '[Peer]',
            `PublicKey = ${pub}`,
            `PreSharedKey = ${psk}`,
            `Endpoint = ${host}:${port}`,
            `PersistentKeepalive = 25`
          ].join('\n');
        } catch {
          return '';
        }
      }

      function parseIniToWireguard(block) {
        try {
          const lines = block.split(/\r?\n/);
          const map = {};
          lines.forEach(l => {
            const [k, v] = l.split('=').map(s => s.trim());
            if (k && v !== undefined) map[k] = v;
          });

          function findKeyIgnoreCase(obj, candidates) {
            const keys = Object.keys(obj);
            for (const cand of candidates) {
              const low = cand.toLowerCase();
              const found = keys.find(k => k.toLowerCase() === low);
              if (found) return obj[found];
            }
            return undefined;
          }

          const privateKey = map['PrivateKey'] || map['Privatekey'] || findKeyIgnoreCase(map, ['privatekey', 'private_key']) || '';
          const endpoint = map['Endpoint'] || map['Endpoint '] || findKeyIgnoreCase(map, ['endpoint', 'endpoint_address']) || '';

          const pskCandidates = ['PresharedKey', 'Presharedkey', 'presharedkey', 'PSK', 'psk', 'PreSharedKey', 'PreSharedkey'];
          const pskValue = map['PresharedKey'] || findKeyIgnoreCase(map, pskCandidates) || '';

          const address = map['Address'] || map['Address '] || findKeyIgnoreCase(map, ['address']) || '';
          const publicKey = map['PublicKey'] || map['Publickey'] || findKeyIgnoreCase(map, ['publickey', 'public_key']) || '';
          const mtu = map['MTU'] || map['Mtu'] || findKeyIgnoreCase(map, ['mtu']) || '1420';

          const url = new URL(`wireguard://${encodeURIComponent(privateKey)}@${endpoint}`);
          if (address) url.searchParams.set('address', address);
          if (pskValue) url.searchParams.set('presharedkey', pskValue);
          if (publicKey) url.searchParams.set('publickey', publicKey);
          url.searchParams.set('mtu', mtu || '1420');
          url.searchParams.set('reserved', '0,0,0');

          return url.toString();
        } catch {
          return '';
        }
      }

      function extractAllJSON(text) {
        const res = [], stack = [], starts = [];
        for (let i = 0; i < text.length; i++) {
          if (text[i] === '{') { if (!stack.length) starts.push(i); stack.push('{'); }
          else if (text[i] === '}') {
            stack.pop();
            if (!stack.length && starts.length) {
              const start = starts.pop();
              try { res.push(JSON.parse(text.slice(start, i + 1))); } catch { }
            }
          }
        }
        return res;
      }

      function countryCodeToFlag(cc) {
        return cc.toUpperCase().replace(/./g, c => String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65));
      }

      const FP_KNOWN = ['randomized', 'random', 'chrome', 'firefox', 'safari',
        'edge', 'android', 'ios', '360', 'qq', 'unsafe'];

      const FP_ALIAS = {
        hellogolang: '', golang: '', hellorandomized: 'randomized',
        hellorandomizedalpn: 'randomized', hellorandomizednoalpn: 'randomized',
        hellochrome: 'chrome', hellofirefox: 'firefox', hellosafari: 'safari',
        helloios: 'ios', helloandroid: 'android', helloedge: 'edge',
        hello360: '360', helloqq: 'qq'
      };

      const FP_COMPAT = { qq: 'chrome', randomized: 'random' };

      function normalizeFp(v) {
        if (v == null) return '';
        let x = String(v).trim().toLowerCase().replace(/["'\s]/g, '');
        if (!x) return '';
        x = x.replace(/_.*$/, '');
        let out = '';
        if (Object.prototype.hasOwnProperty.call(FP_ALIAS, x)) out = FP_ALIAS[x];
        else if (FP_KNOWN.includes(x)) out = x;
        else {
          const alias = Object.keys(FP_ALIAS).find(k => k && x.includes(k));
          if (alias) out = FP_ALIAS[alias];
          else out = FP_KNOWN.find(k => x.includes(k)) || '';
        }
        if (!out) return '';
        return FP_COMPAT[out] || out;
      }

      function setFp(params, ...cands) {
        for (const c of cands) {
          const fp = normalizeFp(c);
          if (fp) { params.set('fp', fp); return fp; }
        }
        return '';
      }

      function buildGeoUrl(host) {
        const tpl = document.getElementById('geoServiceInput').value.trim().replace(/\/+$/, '');
        if (tpl.includes('{ip}')) return tpl.replace(/{ip}/g, host);
        if (tpl.includes('?')) return `${tpl}&ip=${host}`;
        return `${tpl}/${host}`;
      }

      const GEO_TIMEOUT = 7000;
      const GEO_CONCURRENCY = 3;
      const GEO_MIN_INTERVAL = 250;
      const GEO_COOLDOWN = 20000;
      const _dnsCache = new Map();
      const _geoCache = new Map();

      const DOH_SERVICES = [
        (h, t) => `https://dns.google/resolve?name=${encodeURIComponent(h)}&type=${t}`,
        (h, t) => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(h)}&type=${t}&ct=application/dns-json`,
        (h, t) => `https://dns.alidns.com/resolve?name=${encodeURIComponent(h)}&type=${t}`
      ];

      const GEO_FALLBACKS = [
        ip => `https://ipwhois.app/json/${ip}`,
        ip => `https://freeipapi.com/api/json/${ip}`,
        ip => `https://ipapi.co/${ip}/json/`,
        ip => `https://api.iplocation.net/?ip=${ip}`
      ];

      function isIPv4(x) {
        return /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(x || '');
      }
      function isIPv6(x) {
        return typeof x === 'string' && x.includes(':') && /^[0-9a-fA-F:.]+$/.test(x);
      }

      async function fetchJSON(url, timeout = GEO_TIMEOUT) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeout);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
        finally { clearTimeout(timer); }
      }

      function hostFromConfigLine(line) {
        let l = String(line || '').trim();
        if (!l) return '';
        if (/^vmess:\/\//i.test(l) && !l.includes('@')) {
          try {
            const j = JSON.parse(decodeURIComponent(escape(atob(l.replace(/^vmess:\/\//i, '').trim()))));
            if (j && j.add) return String(j.add).trim();
          } catch { }
        }
        l = l.split('#')[0];
        const at = l.lastIndexOf('@');
        if (at >= 0) l = l.slice(at + 1);
        else { const i = l.indexOf('://'); if (i >= 0) l = l.slice(i + 3); }
        l = l.split(/[/?]/)[0];
        const v6 = l.match(/^\[([^\]]+)\]/);
        if (v6) return v6[1];
        return l.split(':')[0].trim();
      }

      async function resolveHostToIp(host) {
        const h = String(host || '').replace(/^\[|\]$/g, '').trim();
        if (!h) return null;
        if (isIPv4(h) || isIPv6(h)) return h;
        if (_dnsCache.has(h)) return _dnsCache.get(h);
        for (const [type, code] of [['A', 1], ['AAAA', 28]]) {
          for (const svc of DOH_SERVICES) {
            const d = await fetchJSON(svc(h, type), 5000);
            if (!d) continue;
            const ans = d.Answer || d.answer;
            if (Array.isArray(ans)) {
              const rec = ans.find(a => a && a.type === code && a.data);
              if (rec) { _dnsCache.set(h, rec.data); return rec.data; }
            }
            if (d.Status === 3) { _dnsCache.set(h, null); return null; }
            if (typeof d.Status === 'number') break;
          }
        }
        _dnsCache.set(h, null);
        return null;
      }

      function pickCountry(d) {
        if (!d || typeof d !== 'object') return null;
        const rawCode = d.country_code || d.countryCode || d.country_code2 ||
          d.code || d.geoplugin_countryCode ||
          (typeof d.country === 'string' && d.country.length === 2 ? d.country : '');
        const code = String(rawCode || '').toUpperCase().slice(0, 2);
        if (!/^[A-Z]{2}$/.test(code)) return null;
        let name = d.country_name || d.countryName || d.geoplugin_countryName ||
          (typeof d.country === 'string' && d.country.length > 2 ? d.country : '') || '';
        const flag = countryCodeToFlag(code);
        if (!name || name.length <= 3 || name.toUpperCase() === code) {
          const entry = countries.find(c => c.flag === flag);
          if (entry) name = entry.name;
        }
        return name ? `${flag} ${name}` : null;
      }

      const _geoCooldown = new Map();
      let _geoGate = Promise.resolve();
      function geoThrottle() {
        const prev = _geoGate;
        let release;
        _geoGate = new Promise(r => { release = r; });
        return prev.then(() => { setTimeout(release, GEO_MIN_INTERVAL); });
      }

      async function countryByIp(ip) {
        if (!ip) return null;
        if (_geoCache.has(ip)) return _geoCache.get(ip);
        const builders = [];
        const el = document.getElementById('geoServiceInput');
        if (el && el.value.trim()) builders.push(x => buildGeoUrl(x));
        GEO_FALLBACKS.forEach(f => builders.push(f));

        const now = () => Date.now();
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 0; i < builders.length; i++) {
            if (pass === 0 && (_geoCooldown.get(i) || 0) > now()) continue;
            await geoThrottle();
            const label = pickCountry(await fetchJSON(builders[i](ip)));
            if (label) {
              _geoCooldown.delete(i);
              _geoCache.set(ip, label);
              return label;
            }
            _geoCooldown.set(i, now() + GEO_COOLDOWN);
          }
        }
        _geoCache.set(ip, null);
        return null;
      }

      function hasCountryLabel(line) {
        const l = String(line || '');
        const i = l.indexOf('#');
        if (i < 0) return false;
        let frag = l.slice(i + 1).trim();
        try { frag = decodeURIComponent(frag); } catch { }
        return /^[\u{1F1E6}-\u{1F1FF}]{2}\s+\S/u.test(frag);
      }

      async function geoLabelLines(lines, onProgress) {
        const clean = lines.map(l => String(l).trim()).filter(Boolean);
        const hosts = [...new Set(
          clean.filter(l => !hasCountryLabel(l)).map(hostFromConfigLine).filter(Boolean)
        )];
        const labels = new Map();
        let done = 0, ok = 0, bad = 0;
        const queue = hosts.slice();

        async function worker() {
          while (queue.length) {
            const h = queue.shift();
            let label = null, why = 'dns';
            const ip = await resolveHostToIp(h);
            if (ip) { why = 'api'; label = await countryByIp(ip); }
            labels.set(h, label || { fail: why });
            if (label) ok++; else bad++;
            done++;
            if (onProgress) onProgress(done, hosts.length, ok, bad);
          }
        }

        await Promise.all(Array.from(
          { length: Math.min(GEO_CONCURRENCY, Math.max(queue.length, 1)) }, worker
        ));

        return clean.map(l => {
          if (hasCountryLabel(l)) return l;
          const base = l.split('#')[0].replace(/\s+$/, '');
          const v = labels.get(hostFromConfigLine(l));
          if (typeof v === 'string') return `${base}#${v}`;
          return `${base}#\u2753 Undefined (${v && v.fail ? v.fail : 'no host'})`;
        });
      }

      function geoSortKey(line) {
        const l = String(line || '');
        const i = l.indexOf('#');
        let frag = i >= 0 ? l.slice(i + 1).trim() : '';
        try { frag = decodeURIComponent(frag); } catch { }
        let country = 'zzzzzzzz';
        const m = frag.match(/^[\u{1F1E6}-\u{1F1FF}]{2}\s*(.+)$/u);
        if (m) country = m[1].trim().toLowerCase().replace(/\s*\([^)]*\)$/, '');
        else if (frag && !/undefined/i.test(frag)) country = frag.toLowerCase();
        const host = hostFromConfigLine(l);
        const hostKey = isIPv4(host)
          ? '0' + host.split('.').map(n => n.padStart(3, '0')).join('.')
          : '1' + host.toLowerCase();
        return [country, hostKey, l];
      }
      function geoSortCompare(a, b) {
        const ka = geoSortKey(a), kb = geoSortKey(b);
        for (let i = 0; i < ka.length; i++) {
          const c = ka[i].localeCompare(kb[i], 'en');
          if (c) return c;
        }
        return 0;
      }

      function buildURLFromLegacy(o, urls) {
        const p = new URLSearchParams();
        p.set('security', o.method || 'none');
        p.set('type', o.network || '');
        if (o.headerType) p.set('headerType', o.headerType);
        if (o.host) p.set('host', o.host);
        if (o.sni) p.set('sni', o.sni);
        if (o.path) p.set('path', o.path);
        if (o.alpn) p.set('alpn', Array.isArray(o.alpn) ? o.alpn.join(',') : o.alpn);
        if (o.pbk) p.set('pbk', o.pbk);
        if (o.sid) p.set('sid', o.sid);
        setFp(p, o.fingerPrint, o.fingerprint, o.fp);
        if (o.spiderX || o.spx) p.set('spx', o.spiderX || o.spx);
        if (o.flow) p.set('flow', o.flow);
        if (o.seed) p.set('seed', o.seed);
        if (o.serviceName) p.set('serviceName', o.serviceName);
        p.set('allowInsecure', o.insecure ? '1' : '0');
        const tag = encodeURIComponent(o.remarks || o.customConfig?.name || '');
        const base = `vless://${o.password}@${o.server}:${o.serverPort}`;
        urls.push(`${base}?${p.toString()}#${tag}`);
      }

      function buildURLsFromOutboundBean(obj, urls) {
        buildURLFromOutbound(obj.outboundBean, obj.remarks, urls);
      }

      function buildURLsFromCustomJSON(obj, urls) {
        obj.custom_json.outbounds.forEach(o => buildURLFromOutbound(o, obj.remarks, urls));
      }

      function buildURLFromOutbound(o, remarks, urls) {
        const proto = o.protocol;
        const tag = encodeURIComponent(remarks || o.tag || proto);
        const p = new URLSearchParams();
        let base = '';

        if (proto === 'shadowsocks') {
          (o.settings.servers || []).forEach(s => {
            const a = btoa(`${s.method}:${s.password}`).replace(/=+$/, '');
            urls.push(`ss://${a}@${s.address}:${s.port}#${tag}`);
          });
          return;
        }

        async function pingHost(host) {
          const timeoutMs = 5000;

          const proto = location.protocol === 'https:' ? 'https:' : 'http:';
          try {

            const adjusted = Math.round(duration * httpFactor);

              const tls = o.tls || {};
              if (tls.enabled) {
                const isReality = tls.reality && tls.reality.enabled;
                p.set('security', isReality ? 'reality' : 'tls');
                if (tls.server_name) p.set('sni', tls.server_name);
                const fp = normFp(tls.utls && tls.utls.fingerprint);
                if (fp) p.set('fp', fp);
                if (tls.insecure) p.set('allowInsecure', '1');
                if (isReality) {
                  if (tls.reality.public_key) p.set('pbk', tls.reality.public_key);
                  if (tls.reality.short_id)   p.set('sid', tls.reality.short_id);
                }
              }
              const tr = o.transport || {};
              p.set('type', tr.type || 'tcp');
              if (tr.type === 'ws') {
                if (tr.path) p.set('path', tr.path);
                if (tr.headers && tr.headers.Host) p.set('host', tr.headers.Host);
              } else if (tr.type === 'grpc' && tr.service_name) {
                p.set('serviceName', tr.service_name);
              } else if (tr.type === 'http' || tr.type === 'httpupgrade') {
                if (tr.path) p.set('path', tr.path);
                if (tr.host) p.set('host', Array.isArray(tr.host) ? tr.host[0] : tr.host);
              }
              return `vless://${o.uuid}@${o.server}:${o.server_port}?${p.toString()}#${encTag}`;
            }

            if (o.type === 'trojan' && o.password && o.server && o.server_port) {
              const p = new URLSearchParams();
              const tls = o.tls || {};
              if (tls.enabled) p.set('security', 'tls');
              if (tls.server_name) p.set('sni', tls.server_name);
              if (tls.insecure) p.set('allowInsecure', '1');
              const fp = normFp(tls.utls && tls.utls.fingerprint);
              if (fp) p.set('fp', fp);
              const qs = p.toString();
              return `trojan://${encodeURIComponent(o.password)}@${o.server}:${o.server_port}${qs ? '?' + qs : ''}#${encTag}`;
            }

            if (o.type === 'shadowsocks' && o.method && o.password && o.server && o.server_port) {
              const auth = btoa(`${o.method}:${o.password}`).replace(/=+$/, '');
              return `ss://${auth}@${o.server}:${o.server_port}#${encTag}`;
            }

            if ((o.type === 'hysteria2' || o.type === 'hysteria') && o.password && o.server && o.server_port) {
              const p = new URLSearchParams();
              const tls = o.tls || {};
              if (tls.server_name) p.set('sni', tls.server_name);
              if (tls.insecure) p.set('insecure', '1');
              const qs = p.toString();
              return `hysteria2://${encodeURIComponent(o.password)}@${o.server}:${o.server_port}${qs ? '?' + qs : ''}#${encTag}`;
            }

            return null;
          }

          function parseUlink(line) {
            if (!line.startsWith('ulink://')) return null;
            try {
              const u = new URL(line.replace(/^ulink:\/\//, 'https://ulink-dummy/'));
              const contentParam = u.searchParams.get('content');

              const hashRaw = u.hash ? u.hash.slice(1) : '';
              let hashTag = '';
              if (hashRaw) {
                try { hashTag = decodeURIComponent(hashRaw); } catch { hashTag = hashRaw; }
              }

              if (!contentParam) return [];

              const decoded = safeAtob(contentParam);
              if (!decoded) return [];

              let parsed;
              try { parsed = JSON.parse(decoded); } catch { return []; }

              const outbounds = Array.isArray(parsed)
                ? parsed
                : (Array.isArray(parsed.outbounds) ? parsed.outbounds : [parsed]);

              const uris = [];
              outbounds.forEach(o => {
                const tag = hashTag || o.tag || '';
                const uri = singBoxOutboundToURI(o, tag);
                if (uri) uris.push(uri);
              });
              return uris;
            } catch { return []; }
          }

          const btn = document.getElementById('btnConvert');
          const origUlink = btn.onclick;
          btn.onclick = async function (...args) {
            await origUlink.apply(this, args);

            const lines = inEl.value.trim().split(/\r?\n/).filter(Boolean);
            const ulinkLines = lines.filter(l => l.trim().startsWith('ulink://'));
            if (!ulinkLines.length) return;

            const uris = [];
            ulinkLines.forEach(l => {
              const res = parseUlink(l.trim());
              if (res) uris.push(...res);
            });

            if (uris.length) {
              outEl.value = (outEl.value ? outEl.value + '\n' : '') + uris.join('\n');
            }
          };
        })();
      });

</script>
